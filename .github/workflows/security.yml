# Security quality gate: secrets, SAST, SCA and dynamic testing.
# Required to merge (job "security-passed"); runs weekly too, so new CVEs surface
# without code changes; also called by the release workflow.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  workflow_call:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  secrets:
    name: secrets (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$archive"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $archive\$" | sha256sum -c -
          tar -xzf "$archive" gitleaks
      - name: Scan every commit
        run: ./gitleaks git --redact --verbose --exit-code 1 .
      - name: No real thread dumps in the repository
        run: git ls-files -z | xargs -0 python3 scripts/check_no_thread_dumps.py

  sast-codeql:
    name: sast (CodeQL ${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload results to the Security tab
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions] # "actions" checks the workflows themselves (injection, permissions)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: /language:${{ matrix.language }}

  sast-bandit:
    name: sast (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - run: pip install "bandit[toml]>=1.8"
      - run: bandit -c pyproject.toml -r src

  sca:
    name: sca (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Resolve what users install, and the CI tool chain
        run: |
          python -m venv /tmp/runtime && /tmp/runtime/bin/pip install -q ".[tui]"
          /tmp/runtime/bin/pip freeze --exclude-editable | grep -v '^tdscope' > runtime.txt
          python -m venv /tmp/tooling && /tmp/tooling/bin/pip install -q ".[dev,tui,security,release]"
          /tmp/tooling/bin/pip freeze --exclude-editable | grep -v '^tdscope' > tooling.txt
          pip install -q "pip-audit>=2.7"
      - name: Audit runtime dependencies (tdscope[tui])
        run: pip-audit --strict --no-deps --disable-pip -r runtime.txt
      - name: Audit development and release tooling
        run: pip-audit --strict --no-deps --disable-pip -r tooling.txt

  sca-dependency-review:
    name: sca (dependency review)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: moderate

  dast:
    name: dast (fuzzing, hostile input, HTML export in a browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev,tui,security]"
      - run: python -m playwright install --with-deps chromium
      - name: Dynamic tests (deep fuzzing profile)
        env:
          HYPOTHESIS_PROFILE: dast
        run: pytest -m dast -rs

  security-passed:
    name: security-passed
    if: always()
    needs: [secrets, sast-codeql, sast-bandit, sca, sca-dependency-review, dast]
    runs-on: ubuntu-latest
    steps:
      - name: All security jobs succeeded (dependency review only runs on pull requests)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            [[ "$result" == "success" || "$result" == "skipped" ]] || exit 1
          done
