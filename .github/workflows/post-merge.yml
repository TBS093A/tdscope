# After a merge to main: build and verify the distributions, then publish a development
# build (e.g. 0.2.1.dev4) to TestPyPI. Real releases go to PyPI from tags: release.yml.
name: Post-merge

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: post-merge
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish-testpypi:
    name: publish dev build to TestPyPI
    needs: build
    # Enabled once the TestPyPI trusted publisher exists (docs/RELEASING.md).
    if: vars.TESTPYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/tdscope/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write # trusted publishing (OIDC), no API token stored anywhere
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
