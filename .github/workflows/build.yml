# Build the distributions once and verify them before anything is published:
# metadata, wheel contents, and a clean install + smoke test on Linux, macOS and Windows.
name: Build

on:
  workflow_call:
    inputs:
      artifact-name:
        description: name of the uploaded distributions artifact
        type: string
        default: dist
    outputs:
      version:
        description: version of the built distributions
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

jobs:
  build:
    name: build sdist and wheel
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # hatch-vcs derives the version from git tags
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - run: pip install ".[release]"
      - run: python -m build
      - name: Metadata renders on PyPI
        run: twine check --strict dist/*
      - name: Wheel contents (no stray or duplicate files)
        run: check-wheel-contents dist/*.whl
      - name: sdist ships the tests and fixtures
        run: tar -tzf dist/*.tar.gz | grep -q "tests/fixtures/aemcs/"
      - id: meta
        name: Version
        run: |
          wheel="$(basename dist/*.whl)"
          version="$(echo "$wheel" | cut -d- -f2)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Built tdscope $version" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.artifact-name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  verify-install:
    name: verify wheel (${{ matrix.os }}, py${{ matrix.python }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: macos-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false # only for scripts/smoke_test.py and the fixtures
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.artifact-name }}
          path: dist
      - name: Install the built wheel in a clean interpreter
        shell: bash
        run: python -m pip install "$(ls dist/*.whl)[tui]"
      - name: Smoke test the installed package
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: python scripts/smoke_test.py --version "$VERSION" --tui
