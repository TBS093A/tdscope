[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "tdscope"
dynamic = ["version"]
description = "Analyze Java (HotSpot) thread dumps: HTTP requests, hot stacks, stuck threads, lock contention and CPU."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "TBS093A" }]
keywords = ["java", "jvm", "thread dump", "jstack", "aem", "performance", "troubleshooting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "mypy>=1.8"]

[project.scripts]
tdscope = "tdscope.cli:main"

[project.urls]
Homepage = "https://github.com/TBS093A/tdscope"
Issues = "https://github.com/TBS093A/tdscope/issues"

[tool.hatch.version]
path = "src/tdscope/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
