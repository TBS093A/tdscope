[build-system]
requires = ["hatchling>=1.18", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "tdscope"
dynamic = ["version"]
description = "Analyze Java (HotSpot) thread dumps: HTTP requests, hot stacks, stuck threads, lock contention and CPU."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "TBS093A" }]
keywords = ["java", "jvm", "thread dump", "jstack", "aem", "performance", "troubleshooting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "tzdata; sys_platform == 'win32'",  # Windows has no system time zone database
]

[project.optional-dependencies]
tui = ["textual>=8"]
dev = ["pytest>=7", "pytest-asyncio>=0.23", "hypothesis>=6.100", "ruff>=0.5", "mypy>=1.8", "textual>=8"]
security = ["bandit>=1.8", "pip-audit>=2.7", "playwright>=1.45"]
release = ["build>=1.2", "twine>=5", "check-wheel-contents>=0.6"]

[project.scripts]
tdscope = "tdscope.cli:main"

[project.urls]
Homepage = "https://github.com/TBS093A/tdscope"
Issues = "https://github.com/TBS093A/tdscope/issues"

[tool.hatch.version]
# Version comes from git tags: v0.2.0 -> 0.2.0, commits after it -> 0.2.1.devN (TestPyPI builds).
source = "vcs"
raw-options = { local_scheme = "no-local-version" }

[tool.hatch.build.hooks.vcs]
version-file = "src/tdscope/_version.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs/TUI.md", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests", "tests/fixtures"]
asyncio_mode = "auto"
markers = ["dast: dynamic security tests (fuzzing, hostile input, exported HTML in a browser)"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/fixtures/*.py" = ["E501"]  # stack frames are long by nature
"docs/**/*.py" = ["E501"]
"src/tdscope/tui/*.py" = ["RUF012"]  # Textual declares BINDINGS as class lists
"tests/test_tui.py" = ["RUF012"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[tool.bandit]
exclude_dirs = ["tests", "docs"]
# B101: asserts only narrow types for mypy, never guard security decisions.
# B105: false positive on the literal "daemon" in the thread header parser.
skips = ["B101", "B105"]
